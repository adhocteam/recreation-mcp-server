<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Main content area -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="white" opacity="0.98"/>
  
  <!-- Icon circle -->
  <circle cx="180" cy="220" r="80" fill="#667eea"/>
  
  <!-- Mountain peaks in icon -->
  <path d="M 130 240 L 160 190 L 180 210 L 200 185 L 230 240 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Pine trees in icon -->
  <path d="M 150 240 L 150 225 L 145 225 L 150 215 L 145 215 L 150 205 L 155 215 L 150 215 L 155 225 L 150 225 Z" fill="#2d3748"/>
  <path d="M 210 240 L 210 228 L 205 228 L 210 220 L 205 220 L 210 210 L 215 220 L 210 220 L 215 228 L 210 228 Z" fill="#2d3748"/>
  
  <!-- Sun in icon -->
  <circle cx="215" cy="185" r="12" fill="#fbbf24" opacity="0.95"/>
  
  <!-- Text content -->
  <text x="320" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" fill="#1a202c">
    OutdoorGPT
  </text>
  
  <text x="320" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="400" fill="#2d3748">
    Discover outdoor recreation through AI
  </text>
  
  <!-- Feature badges -->
  <rect x="320" y="290" width="180" height="50" rx="8" fill="#f7fafc" stroke="#667eea" stroke-width="2"/>
  <text x="410" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#2d3748" text-anchor="middle">
    🏞️ National Parks
  </text>
  
  <rect x="520" y="290" width="160" height="50" rx="8" fill="#f7fafc" stroke="#667eea" stroke-width="2"/>
  <text x="600" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#2d3748" text-anchor="middle">
    ⛺ Campgrounds
  </text>
  
  <rect x="700" y="290" width="140" height="50" rx="8" fill="#f7fafc" stroke="#667eea" stroke-width="2"/>
  <text x="770" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#2d3748" text-anchor="middle">
    🌤️ Weather
  </text>
  
  <rect x="860" y="290" width="120" height="50" rx="8" fill="#48bb78"/>
  <text x="920" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">
